schema_version = 1
provider_id = "openai"
origin = "https://api.openai.com"

[authentication]
kind = "bearer"
header = "Authorization"
prefix = "Bearer "

[limits]
max_request_bytes = 8388608
max_response_bytes = 33554432
timeout_ms = 120000

[operations."openai.responses.create"]
method = "POST"
path = "/v1/responses"
streaming = false
