manifest_version = 1
skills = ["portus-browser"]

[provider]
type = "portus-browser"
label = "PortusBrowser"
scope_support = ["system"]
software_version = "0.1.0"

[[interfaces]]
id = "cli"
type = "executable"
contract_version = 1
executable = "/usr/bin/portus-browser"
structured_output = true

[[capabilities]]
id = "browser.control"
contract_version = 1
interfaces = ["cli"]

[[resources]]
type = "browser-session"
authority = "provider"
lifetime = "session"

[lifecycle]
owner = "provider-owned"

[health]
kind = "structured-cli"
reference = "cli"

[policy]
domain_owner = "provider"
