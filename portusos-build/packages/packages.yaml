schema_version: 1

source_policies:
  official-artix:
    verification: artix-signature-keyring
    installation_owner: pacman-artools
    update_owner: pacman
    failure_behavior: fail-closed
    public_redistribution: pending-review
  portus-owned:
    verification: source-revision-local-package-hash
    installation_owner: portusos-build
    update_owner: portusos-release
    failure_behavior: fail-build
    public_redistribution: pending-review
  approved-external:
    verification: component-contract
    installation_owner: component-contract
    update_owner: explicit-component-workflow
    failure_behavior: fail-build-or-degrade-per-contract
    public_redistribution: pending-review
  validation-only:
    verification: selected-source-contract
    installation_owner: validation-profile
    update_owner: validation-profile
    failure_behavior: fail-validation-profile
    public_redistribution: pending-review
  hardware-selected:
    verification: selected-source-contract
    installation_owner: hardware-profile
    update_owner: source-owner
    failure_behavior: fail-selected-profile
    public_redistribution: pending-review

packages:
  - id: artix-base
    role: base-system
    source_class: official-artix
    required_for_first_iso: true
    profile: base
    package:
      resolution: locked
      names: [base, artix-live-base, artix-live-openrc, artix-grub-live, iso-initcpio, linux-firmware, intel-ucode, amd-ucode]
      unresolved_reason: null
      required_gate: L2

