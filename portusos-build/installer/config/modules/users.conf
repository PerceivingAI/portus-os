---
defaultGroups:
  - { name: users, must_exist: true, system: true }
  - lp
  - video
  - network
  - storage
  - { name: wheel, must_exist: false, system: true }
  - audio
  - power
  - log
  - optical
  - scanner
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: false
passwordRequirements:
  nonempty: true
  minLength: 4
  maxLength: -1
  libpwquality:
    - minlen=4
    - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
user:
  shell: /bin/bash
  forbidden_names: [root]
