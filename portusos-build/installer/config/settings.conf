---
modules-search: [local]

instances:
  - id: portus-storage-input
    module: notesqml
    config: portus-storage-input.conf
  - id: preflight
    module: portus-storage
    config: portus-storage-preflight.conf
  - id: prepare
    module: portus-storage
    config: portus-storage.conf
  - id: finalize
    module: portus-storage
    config: portus-storage-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - users
      - notesqml@portus-storage-input
      - summary
  - exec:
      - portus-storage@preflight
      - portus-storage@prepare
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - portus-storage@finalize
      - initcpio
      - services-openrc
      - bootloader
      - umount
  - show:
      - finished

branding: default
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
